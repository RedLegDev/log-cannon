name = "log-cannon-ingest"
main = "src/index.ts"
compatibility_date = "2024-12-30"

# Replace yourdomain.com with the zone that fronts your ingest hostname.
#
# Trailing `*` on path routes is required: CF route matching includes the query
# string, and patterns may not contain `?…`. Without the wildcard, `?apiKey=` /
# `?preset=` requests miss the Worker and fall through to the dashboard (307).
# See https://developers.cloudflare.com/workers/configuration/routing/routes/
# ("Matching behavior"). The ingest hostname has no other services, so the
# suffix wildcard cannot over-capture dashboard paths.
routes = [
  { pattern = "logs.yourdomain.com/v1/logs*", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/v1/traces*", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/ingest/otlp/*", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/ingest/webhook*", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/ingest/clef*", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/api/events/raw*", zone_name = "yourdomain.com" },
  # Uptime / probe path. Without this the handler deploys but /health falls
  # through to the dashboard and 307s to login (same class of bug as /v1/keys).
  { pattern = "logs.yourdomain.com/health*", zone_name = "yourdomain.com" },
  # Key registry admin API. Trailing * covers /v1/keys, /v1/keys/{id}, and
  # query strings. Without these the handler deploys but is unreachable —
  # the request falls through to the dashboard and 307s to its login page.
  { pattern = "logs.yourdomain.com/v1/keys*", zone_name = "yourdomain.com" },
]

# Latency visibility for the ingest path. Without this the Worker emits nothing
# a slow request can be found in: a sender that aborts its own fetch never reads
# the response, so its `TimeoutError` is the only trace the request ever existed.
# `invocation_logs` carries per-request wall time, CPU time and outcome — that is
# where ingest p95/p99 lives — and retains the `slow-ingest-request` warning the
# Worker writes above SLOW_REQUEST_MS.
#
# Deliberately no `logs.destinations` here. Forwarding a Worker's logs onward to
# a Log Cannon ingest route is the right shape for every *other* Worker, but on
# this one it is a feedback loop: the destination delivers to `/ingest/webhook`
# on the very Worker whose invocations it is reporting, and each delivery
# generates fresh invocation logs to deliver. Read these in Workers Logs; the
# slow-request events reach ClickHouse by the queue instead (SLOW_REQUEST_SOURCE).
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[vars]
# Report any ingest request that spends this long in the Worker. "0" disables
# reporting. See workers/packages/ingest/src/timing.ts for what is measured —
# notably not cold start or connection setup, both of which happen before the
# Worker is invoked.
SLOW_REQUEST_MS = "1000"
# logs.events source that slow-request events are written to, through the same
# queue as every other event. Empty leaves Workers Logs as the only channel.
SLOW_REQUEST_SOURCE = "log-cannon-ingest"
# Stop holding the caller after this long waiting for the queue to acknowledge a
# send, and finish the send in waitUntil instead. "0" is off: await the ack in
# full, which is the behaviour that predates this var.
#
# Off by default on purpose. Switching it on means the Worker can answer 201
# before the queue has durably accepted the payload, so a send that fails after
# that point is a loss the client already believes succeeded (reported as
# ingest-enqueue-failed-after-response, never silent). Turn it on only when the
# queue's ack tail is the thing hurting senders — see workers/packages/ingest/
# src/enqueue.ts.
QUEUE_ACK_DEADLINE_MS = "0"

[[queues.producers]]
queue = "log-cannon-ingest"
binding = "INGEST_QUEUE"

[[d1_databases]]
binding = "KEYS_DB"
database_name = "log-cannon-keys"
# Create with: wrangler d1 create log-cannon-keys — then paste the id here.
database_id = "<your-d1-database-id>"
migrations_dir = "migrations"


# --- Red Leg Dev production deploy (logs.redleg.dev) ---
# Deployed via `wrangler deploy --env production` (Cloudflare Workers Builds).
# The top-level config above stays generic for self-hosters; this env carries
# the real routes + D1 binding. None of these are secrets: the ingest hostname
# is already public and a D1 database id is an identifier, not a credential.
# API keys / other secrets live in the Cloudflare dashboard, not here.
[env.production]
name = "log-cannon-ingest"
routes = [
  { pattern = "logs.redleg.dev/v1/logs*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/v1/traces*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/ingest/otlp/*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/ingest/webhook*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/ingest/clef*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/api/events/raw*", zone_name = "redleg.dev" },
  # Uptime / probe path. Without this the handler deploys but /health falls
  # through to the dashboard and 307s to login (same class of bug as /v1/keys).
  { pattern = "logs.redleg.dev/health*", zone_name = "redleg.dev" },
  # Key registry admin API. Trailing * covers /v1/keys, /v1/keys/{id}, and
  # query strings. Without these the handler deploys but is unreachable —
  # the request falls through to the dashboard and 307s to its login page.
  { pattern = "logs.redleg.dev/v1/keys*", zone_name = "redleg.dev" },
]

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
invocation_logs = true

[env.production.vars]
SLOW_REQUEST_MS = "1000"
SLOW_REQUEST_SOURCE = "log-cannon-ingest"
QUEUE_ACK_DEADLINE_MS = "0"

[[env.production.queues.producers]]
queue = "log-cannon-ingest"
binding = "INGEST_QUEUE"

[[env.production.d1_databases]]
binding = "KEYS_DB"
database_name = "log-cannon-keys"
database_id = "5809a419-53ba-4f3e-9c8f-f830339c8f25"
migrations_dir = "migrations"
