name = "log-cannon-ingest"
main = "src/index.ts"
compatibility_date = "2024-12-30"
# Keep vars set on the deployed Worker that this file doesn't declare, such
# as production's SUPABASE_PULL_PROJECTS (it names projects, and this repo is
# public). Vars declared here still win on every deploy. Applies to all envs.
keep_vars = true

# Replace yourdomain.com with the zone that fronts your ingest hostname.
#
# Trailing `*` on path routes is required: CF route matching includes the query
# string, and patterns may not contain `?…`. Without the wildcard, `?apiKey=` /
# `?preset=` requests miss the Worker and fall through to the dashboard (307).
# See https://developers.cloudflare.com/workers/configuration/routing/routes/
# ("Matching behavior"). The ingest hostname has no other services, so the
# suffix wildcard cannot over-capture dashboard paths.
routes = [
  { pattern = "logs.yourdomain.com/v1/logs*", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/v1/traces*", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/ingest/otlp/*", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/ingest/webhook*", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/ingest/clef*", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/api/events/raw*", zone_name = "yourdomain.com" },
  # Uptime / probe path. Without this the handler deploys but /health falls
  # through to the dashboard and 307s to login (same class of bug as /v1/keys).
  { pattern = "logs.yourdomain.com/health*", zone_name = "yourdomain.com" },
  # Key registry admin API. Trailing * covers /v1/keys, /v1/keys/{id}, and
  # query strings. Without these the handler deploys but is unreachable —
  # the request falls through to the dashboard and 307s to its login page.
  { pattern = "logs.yourdomain.com/v1/keys*", zone_name = "yourdomain.com" },
]

# Latency visibility for the ingest path. Without this the Worker emits nothing
# a slow request can be found in: a sender that aborts its own fetch never reads
# the response, so its `TimeoutError` is the only trace the request ever existed.
# `invocation_logs` carries per-request wall time, CPU time and outcome — that is
# where ingest p95/p99 lives — and retains the `slow-ingest-request` warning the
# Worker writes above SLOW_REQUEST_MS.
#
# Deliberately no `logs.destinations` here. Forwarding a Worker's logs onward to
# a Log Cannon ingest route is the right shape for every *other* Worker, but on
# this one it is a feedback loop: the destination delivers to `/ingest/webhook`
# on the very Worker whose invocations it is reporting, and each delivery
# generates fresh invocation logs to deliver. Read these in Workers Logs; the
# slow-request events reach Basin through sendTelemetry instead (SLOW_REQUEST_SOURCE).
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[vars]
# Report any ingest request that spends this long in the Worker. "0" disables
# reporting. See workers/packages/ingest/src/timing.ts for what is measured —
# notably not cold start or connection setup, both of which happen before the
# Worker is invoked.
SLOW_REQUEST_MS = "1000"
# logs.events source that slow-request events are written to, in Basin like
# every other event. Empty leaves Workers Logs as the only channel.
SLOW_REQUEST_SOURCE = "log-cannon-ingest"
# Basin (refs #163, #171) is the only store. Ingest writes nothing unless
# BASIN_WRITE is exactly "true" and a [[pipelines]] binding named LOGS points
# at your stream (see [env.production] below); without both, a request is
# answered 2xx and stored nowhere. Left unset here because this generic config
# has no stream to bind.
# Alert evaluator (refs #165): "off", "shadow" (evaluate and record, send
# nothing) or "live". Alerts run on the once-a-minute cron below against Basin
# SQL, with every now() in an alert query pinned ALERT_LAG_SECONDS back so a
# window never ends in data Basin hasn't received yet. Live email also needs
# SAASMAIL_API_URL and ALERT_FROM_EMAIL here and the SAASMAIL_API_KEY secret.
ALERTS_MODE = "off"
ALERT_LAG_SECONDS = "180"
ALERTS_SOURCE = "log-cannon-alerts"
# Basin retention (refs #167), on the second cron: "off", "dry-run" (report
# what it would drop, change nothing) or "delete" (also needs the
# BASIN_CATALOG_TOKEN secret, R2 Data Catalog write, and a BASIN_EVENTS bucket
# binding). Keys with retention_days = 0 get the default window.
BASIN_RETENTION_MODE = "off"
BASIN_RETENTION_DEFAULT_DAYS = "30"
# Supabase platform-log pull (refs #164), on the same cron: "ref=source,…"
# for each project, written to the Basin stream as format = 'supabase'. Empty
# is a no-op. Needs BASIN_WRITE on and the SUPABASE_ACCESS_TOKEN secret.
# Empty tables means postgres_logs, auth_logs, function_logs and
# function_edge_logs.
SUPABASE_PULL_PROJECTS = ""
SUPABASE_PULL_TABLES = "postgres_logs,auth_logs,function_logs,function_edge_logs"

# The second cron is Basin retention (src/basin-retention.ts, RETENTION_CRON).
[triggers]
crons = ["* * * * *", "17 20 * * *"]

[[d1_databases]]
binding = "KEYS_DB"
database_name = "log-cannon-keys"
# Create with: wrangler d1 create log-cannon-keys — then paste the id here.
database_id = "<your-d1-database-id>"
migrations_dir = "migrations"


# --- Red Leg Dev production deploy (logs.redleg.dev) ---
# Deployed via `wrangler deploy --env production` (Cloudflare Workers Builds).
# The top-level config above stays generic for self-hosters; this env carries
# the real routes + D1 binding. None of these are secrets: the ingest hostname
# is already public and a D1 database id is an identifier, not a credential.
# API keys / other secrets live in the Cloudflare dashboard, not here.
[env.production]
name = "log-cannon-ingest"
routes = [
  { pattern = "logs.redleg.dev/v1/logs*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/v1/traces*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/ingest/otlp/*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/ingest/webhook*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/ingest/clef*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/api/events/raw*", zone_name = "redleg.dev" },
  # Uptime / probe path. Without this the handler deploys but /health falls
  # through to the dashboard and 307s to login (same class of bug as /v1/keys).
  { pattern = "logs.redleg.dev/health*", zone_name = "redleg.dev" },
  # Key registry admin API. Trailing * covers /v1/keys, /v1/keys/{id}, and
  # query strings. Without these the handler deploys but is unreachable —
  # the request falls through to the dashboard and 307s to its login page.
  { pattern = "logs.redleg.dev/v1/keys*", zone_name = "redleg.dev" },
  # v2 read API on Basin (refs #163): /v2/api/v1/query, /v2/api/v1/logs,
  # /v2/api/mcp, side by side with the dashboard's v1 until cutover.
  { pattern = "logs.redleg.dev/v2/*", zone_name = "redleg.dev" },
  # Cutover (refs #168): the unprefixed read paths, live since the 2026-11-04
  # window. They take these paths from the host's v1 dashboard. Rollback is
  # reverting the commit that uncommented them.
  { pattern = "logs.redleg.dev/api/v1/query*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/api/v1/logs*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/api/mcp*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/api/v1/alerts*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/api/v1/alert-destinations*", zone_name = "redleg.dev" },
  # Every unprefixed path in READ_PATHS (src/index.ts) needs a route here;
  # without one it falls through to the host origin (refs #191, #193).
  { pattern = "logs.redleg.dev/api/v1/alert-firings*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/api/v1/stats*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/api/v1/events/*", zone_name = "redleg.dev" },
]

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
invocation_logs = true

[env.production.vars]
SLOW_REQUEST_MS = "1000"
SLOW_REQUEST_SOURCE = "log-cannon-ingest"
# The only write path (refs #171). Off, ingest accepts requests and stores
# nothing.
BASIN_WRITE = "true"
# v2 read API (refs #163). BASIN_SQL_TOKEN is a secret (Basin SQL read only).
BASIN_SQL_ACCOUNT = "ab1da25c524f59bc61f776304bd88558"
BASIN_SQL_BUCKET = "log-cannon-events"
# Alerts on D1 + Basin (refs #165). Live since the 2026-11-04 cutover, which
# retired the Go alert-worker.
ALERTS_MODE = "live"
ALERT_LAG_SECONDS = "180"
# Batched alert queries (refs #194): "off", "shadow" (run both, the per-alert
# results fire, differences are reported) or "on".
ALERT_BATCH_MODE = "on"
ALERTS_SOURCE = "log-cannon-alerts"
# Alert email (refs #170), the same sender and API v1 used. The
# SAASMAIL_API_KEY secret is set on the Worker, not here.
SAASMAIL_API_URL = "https://mail.redleg.dev"
ALERT_FROM_EMAIL = "alerts@redleg.dev"
# Basin retention (refs #167). Off since 2026-11-10 (Matt, 10-26: storage is
# cheap). The dry run would warn daily once data passes 30 days. Turning on
# "delete" (and setting BASIN_CATALOG_TOKEN) is a deliberate decision.
BASIN_RETENTION_MODE = "off"
BASIN_RETENTION_DEFAULT_DAYS = "30"
# Supabase pull (refs #164). SUPABASE_PULL_PROJECTS is deliberately not set
# here: its "ref=source" pairs name projects and this repo is public. It is a
# var set on the deployed Worker, kept across deploys by keep_vars below. The
# token is the SUPABASE_ACCESS_TOKEN secret.
SUPABASE_PULL_TABLES = "postgres_logs,auth_logs,function_logs,function_edge_logs"

[env.production.triggers]
crons = ["* * * * *", "17 20 * * *"]

# Basin stream log_events_v1 (refs #163), the only store. BASIN_WRITE gates it.
[[env.production.pipelines]]
stream = "77f5efc2ffb5428e9a49c6cf1444cd67"
binding = "LOGS"

# Basin copies the stream wouldn't take after retries (refs #166), replayed by
# the cron. Create with: wrangler r2 bucket create log-cannon-basin-spill
[[env.production.r2_buckets]]
binding = "BASIN_SPILL"
bucket_name = "log-cannon-basin-spill"

# The Basin Catalog bucket itself (refs #167): retention reads and rewrites
# Iceberg manifests here. It never touches data files directly.
[[env.production.r2_buckets]]
binding = "BASIN_EVENTS"
bucket_name = "log-cannon-events"

[[env.production.d1_databases]]
binding = "KEYS_DB"
database_name = "log-cannon-keys"
database_id = "5809a419-53ba-4f3e-9c8f-f830339c8f25"
migrations_dir = "migrations"
