name = "log-cannon-ingest"
main = "src/index.ts"
compatibility_date = "2024-12-30"

# Replace yourdomain.com with the zone that fronts your ingest hostname.
routes = [
  { pattern = "logs.yourdomain.com/v1/logs", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/v1/traces", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/ingest/otlp/*", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/ingest/webhook", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/ingest/clef", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/api/events/raw", zone_name = "yourdomain.com" },
  # Key registry admin API. Without these the handler deploys but is unreachable —
  # the request falls through to the dashboard and 307s to its login page.
  { pattern = "logs.yourdomain.com/v1/keys", zone_name = "yourdomain.com" },
  { pattern = "logs.yourdomain.com/v1/keys/*", zone_name = "yourdomain.com" },
]

[[queues.producers]]
queue = "log-cannon-ingest"
binding = "INGEST_QUEUE"

[[kv_namespaces]]
binding = "API_KEYS"
# Create with: wrangler kv namespace create API_KEYS — then paste the id here.
id = "<your-kv-namespace-id>"

[[d1_databases]]
binding = "KEYS_DB"
database_name = "log-cannon-keys"
# Create with: wrangler d1 create log-cannon-keys — then paste the id here.
database_id = "<your-d1-database-id>"
migrations_dir = "migrations"


# --- Red Leg Dev production deploy (logs.redleg.dev) ---
# Deployed via `wrangler deploy --env production` (Cloudflare Workers Builds).
# The top-level config above stays generic for self-hosters; this env carries
# the real routes + KV binding. None of these are secrets: the ingest hostname
# is already public and a KV namespace id is an identifier, not a credential.
# API keys / other secrets live in the Cloudflare dashboard, not here.
[env.production]
name = "log-cannon-ingest"
routes = [
  { pattern = "logs.redleg.dev/v1/logs", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/v1/traces", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/ingest/otlp/*", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/ingest/webhook", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/ingest/clef", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/api/events/raw", zone_name = "redleg.dev" },
  # Key registry admin API. Without these the handler deploys but is unreachable —
  # the request falls through to the dashboard and 307s to its login page.
  { pattern = "logs.redleg.dev/v1/keys", zone_name = "redleg.dev" },
  { pattern = "logs.redleg.dev/v1/keys/*", zone_name = "redleg.dev" },
]

[[env.production.queues.producers]]
queue = "log-cannon-ingest"
binding = "INGEST_QUEUE"

[[env.production.kv_namespaces]]
binding = "API_KEYS"
id = "3cdaa6591a6e415488072c7094cf3c36"

[[env.production.d1_databases]]
binding = "KEYS_DB"
database_name = "log-cannon-keys"
database_id = "5809a419-53ba-4f3e-9c8f-f830339c8f25"
migrations_dir = "migrations"

