version: 2

updates:
  # ── JavaScript / TypeScript ──────────────────────────────────────────────
  # workers (Cloudflare Workers, pnpm + pnpm-lock.yaml — uses the npm ecosystem)
  - package-ecosystem: "npm"
    directory: "/workers"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(workers)"
      prefix-development: "chore(workers-dev)"
    groups:
      workers-production:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      workers-development:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      workers-security:
        applies-to: security-updates
        patterns:
          - "*"
